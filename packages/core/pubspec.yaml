name: core
description: NeuroBleed Core - Network, Router, Storage, Localization
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared:
    path: ../shared
  dio: ^5.4.0
  go_router: ^17.3.0
  flutter_secure_storage: ^9.0.0
  flutter_riverpod: ^2.4.9
  web_socket_channel: ^3.0.0
  connectivity_plus: ^6.0.0
  intl: ^0.20.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  json_annotation: ^4.8.1
  path_provider: ^2.1.0
  isar_community: ^3.3.2
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  isar_community_generator: ^3.3.2
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - lib/localization/l10n/
