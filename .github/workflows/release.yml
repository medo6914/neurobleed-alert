name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-attach:
    name: Build & Attach to Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JKS_BASE64: ${{ secrets.JKS_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-release

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-release-${{ runner.os }}-${{ hashFiles('apps/mobile_flutter/pubspec.lock', 'packages/core/pubspec.yaml', 'packages/design_system/pubspec.yaml', 'packages/shared/pubspec.yaml') }}
          restore-keys: |
            pub-cache-release-${{ runner.os }}-

      - name: Flutter pub get
        working-directory: apps/mobile_flutter
        run: flutter pub get

      - name: Create release keystore (from secrets)
        if: ${{ env.JKS_BASE64 != '' }}
        working-directory: apps/mobile_flutter/android/app
        run: echo "$JKS_BASE64" | base64 -d > neurobleed-keystore.jks

      - name: Build Debug APK
        working-directory: apps/mobile_flutter
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Build Release APK (signed)
        if: ${{ hashFiles('apps/mobile_flutter/android/app/neurobleed-keystore.jks') != '' }}
        working-directory: apps/mobile_flutter
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Web (release)
        working-directory: apps/mobile_flutter
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL
          else
            flutter build web --release
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp apps/mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk release-assets/app-debug.apk
          if [ -f apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk release-assets/app-release.apk
          fi
          (cd apps/mobile_flutter/build/web && tar -czf ../../../../release-assets/flutter-web.tar.gz .)

      - name: Upload Artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
