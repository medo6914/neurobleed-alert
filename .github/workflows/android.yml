name: Android Build

on:
  push:
    branches: [main, master, phase8-hospital-platform]
    paths:
      - 'apps/mobile_flutter/**'
      - 'packages/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, master, phase8-hospital-platform]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-android

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-android-${{ runner.os }}-${{ hashFiles('apps/mobile_flutter/pubspec.lock', 'packages/core/pubspec.yaml', 'packages/design_system/pubspec.yaml', 'packages/shared/pubspec.yaml') }}
          restore-keys: |
            pub-cache-android-${{ runner.os }}-

      - name: Flutter pub get
        working-directory: apps/mobile_flutter
        run: flutter pub get

      - name: Build Debug APK
        working-directory: apps/mobile_flutter
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90
