name: neurobleed_mobile
description: NeuroBleed Alert Mobile - Android & iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Monorepo packages
  design_system:
    path: ../../packages/design_system
  shared:
    path: ../../packages/shared
  core:
    path: ../../packages/core

  # External
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  go_router: ^14.0.0
  fl_chart: ^0.68.0
  intl: ^0.20.0
  firebase_messaging: ^15.0.0
  firebase_core: ^3.0.0
  url_launcher: ^6.2.2
  json_annotation: ^4.8.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  web_socket_channel: ^3.0.0
  flutter_blue_plus: ^1.32.0
  connectivity_plus: ^6.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  equatable: ^2.0.5
  flutter_secure_storage: ^9.0.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  isar_community_generator: ^3.3.2
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
