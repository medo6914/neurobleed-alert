name: neurobleed_mobile
description: NeuroBleed Alert Mobile - Android & iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Monorepo packages
  design_system:
    path: ../../packages/design_system
  shared:
    path: ../../packages/shared
  core:
    path: ../../packages/core

  # External
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  go_router: ^14.0.0
  fl_chart: ^0.68.0
  intl: ^0.20.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  firebase_performance: ^0.10.0
  firebase_app_check: ^0.3.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.0.0
  url_launcher: ^6.2.2
  open_filex: ^4.5.0
  json_annotation: ^4.8.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  web_socket_channel: ^3.0.0
  flutter_blue_plus: ^1.32.0
  web: ^1.0.0
  local_auth: ^2.1.8
  connectivity_plus: ^6.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  equatable: ^2.0.5
  flutter_secure_storage: ^9.0.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  isar_community_generator: ^3.3.2
  mocktail: ^1.0.3
  dio: ^5.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
  adaptive_icon_background: "#0A0E1A"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
